# Standalone production deployment: docker compose -f compose.market.yaml up -d --build
services:
  libraai:
    build: .
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      LIBRAAI_ENV: production
      LIBRAAI_DB_PATH: /data/libraai.db
    expose: ["8000"]
    volumes:
      - libraai_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      LIBRAAI_BACKEND_URL: http://libraai:8000
    expose: ["3000"]
    depends_on:
      libraai:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    env_file: [.env]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
volumes:
  libraai_data:
  caddy_data:
  caddy_config:
