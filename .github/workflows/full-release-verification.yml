name: LibraAI full release verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check package hygiene
        run: python -B buyer_preflight.py
      - name: Report production configuration blockers (never prints secrets)
        run: python -B production_preflight.py
      - name: Test production preflight and environment templates
        run: python -B -m unittest -v test_release_portability.py test_production_preflight.py test_environment_templates.py
      - name: Require payment callback integration tests (no skips)
        run: python -B verify_payment_route_tests.py
      - name: Run strict complete Python suite (zero skips required)
        run: python -B verify_full_test_suite.py
      - name: Public/private route acceptance checks
        run: python -B buyer_acceptance.py
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Validate Docker Compose and build backend image
        run: |
          cp .env.production.example .env
          docker compose config --quiet
          docker build --pull --tag libraai:release-verification .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install exact frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo 'Frontend lockfile is not committed yet; bootstrap it and upload it for review.'
            npm install --no-audit --no-fund
          fi
      - name: Verify lockfile is consumable by a clean install
        run: npm ci --no-audit --no-fund
      - name: Verify direct dependency pins match package.json
        run: node scripts/verify-lockfile.mjs
      - name: Verify shared page shell and security headers
        run: |
          npm run verify:shell
          npm run verify:security-headers
      - name: Build production Next.js frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          LIBRAAI_BACKEND_URL: http://127.0.0.1:5000
        run: npm run build
      - name: Upload generated dependency lockfile for review
        if: always() && hashFiles('frontend/package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: libraai-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run real-browser end-to-end suite
        env:
          CI: '1'
          LIBRAAI_BASE_URL: http://127.0.0.1:5000
          LIBRAAI_DB_PATH: ./libraai-e2e.db
          SECRET_KEY: local-e2e-only-secret-key-change-before-production-12345
        run: npm run test:e2e

  frontend-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBRAAI_ENV: development
      LIBRAAI_DB_PATH: /tmp/libraai-frontend-e2e.sqlite3
      SECRET_KEY: local-e2e-only-secret-key-change-before-production-12345
      NEXT_TELEMETRY_DISABLED: '1'
      LIBRAAI_BACKEND_URL: http://127.0.0.1:5000
      LIBRAAI_FRONTEND_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend and Playwright dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Install Next.js dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Start isolated backend and wait for health endpoint
        run: |
          nohup python app.py > /tmp/libraai-e2e-backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5000/api/health
      - name: Build Next.js production frontend
        working-directory: frontend
        run: npm run build
      - name: Start frontend and wait for HTTP response
        run: |
          cd frontend
          nohup npm run start > /tmp/libraai-e2e-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
      - name: Run Next.js desktop/mobile browser smoke tests
        run: npm run test:e2e:frontend
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libraai-nextjs-browser-diagnostics
          path: |
            playwright-frontend-report/
            /tmp/libraai-e2e-backend.log
            /tmp/libraai-e2e-frontend.log
          if-no-files-found: ignore
