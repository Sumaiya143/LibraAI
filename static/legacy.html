<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LibraAI — Read · Learn · Grow</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172b63;background:#eef4ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#5a50ed;color:white}button.secondary{background:#edf0ff;color:#4c49c7}button:hover{filter:brightness(.96)}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid #dce6ff;padding:22px 14px}.brand{font-weight:850;color:#453ce0;font-size:24px;margin:0 8px 28px}.brand small{display:block;color:#8996b7;font-size:10px}.nav{display:block;width:100%;text-align:left;background:transparent;color:#465985;margin:5px 0}.nav.active{background:linear-gradient(90deg,#4c69d8,#7765f2);color:white}.main{padding:20px 28px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.search{max-width:460px;width:100%}input,select,textarea{padding:12px;border:1px solid #d9e2f7;border-radius:10px;background:white;color:#243466;width:100%}.panel{background:#fff;border:1px solid #dfe7fa;border-radius:15px;padding:19px;box-shadow:0 4px 15px #3659a00a;margin-bottom:18px}.hero{background:linear-gradient(110deg,#101d54 0%,#293a80 58%,#7367b4 100%);color:white;border-radius:18px;padding:42px;min-height:230px}.hero h1{font-size:36px;max-width:560px;margin:9px 0}.hero p{max-width:540px;color:#dce5ff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat strong{display:block;font-size:26px;color:#454ee4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.book{border:1px solid #e2e9fa;border-radius:12px;padding:13px;background:#fff}.cover{height:170px;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;color:white;font-weight:800;font-size:21px;padding:15px;margin-bottom:12px;background:linear-gradient(145deg,#c78a54,#5a2f3b)}.book:nth-child(3n+2) .cover{background:linear-gradient(145deg,#d86b3d,#271a35)}.book:nth-child(3n) .cover{background:linear-gradient(145deg,#3a7080,#171c4c)}.book h4{margin:6px 0}.muted{color:#7c8bab;font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.split{display:grid;grid-template-columns:2fr 1fr;gap:16px}.hidden{display:none!important}.form{max-width:460px;margin:auto}.form>*{margin-bottom:12px}.message{padding:12px;color:#4050a0;background:#eff2ff;border-radius:9px;margin-bottom:15px}.pill{display:inline-block;background:#eef0ff;color:#4c50bc;padding:5px 10px;border-radius:20px;font-size:12px}footer{padding:25px;text-align:center;color:#8895af}h2{margin-top:0}@media(max-width:750px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;padding:10px}.brand{min-width:135px;margin:7px}.nav{white-space:nowrap;width:auto}.main{padding:15px}.hero{padding:23px}.hero h1{font-size:26px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="/image-slots.css"></head><body><div class="layout"><aside class="side"><div class="brand">📖 LibraAI<small>Read · Learn · Grow</small></div><div id="nav"></div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="⌕ Search books, authors, genres..."><div class="row"><span id="who" class="muted">Guest</span><button id="auth" onclick="go('login')">Sign in</button></div></header><div id="message" class="message hidden"></div><div id="view"></div><footer>LibraAI · Prototype build · Payments and licensed book content require integration</footer></main></div><script>
let user=null,books=[],page='home',selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,data){let r=await fetch('/api/'+path,{method:data===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function notice(s){$('#message').textContent=s;$('#message').classList.remove('hidden')}function go(p){page=p;$('#message').classList.add('hidden');render()}function nav(){let items=[['home','⌂ Home'],['catalog','▤ Book Catalog'],['library','▣ My Library'],['reader','📖 Book Reader'],['notes','✎ Notes & Highlights'],['community','♧ Reading Community'],['assistant','✧ AI Book Assistant'],['dashboard','▥ Dashboard'],['merchant','♙ Publisher Portal'],['orders','🛒 Orders'],['login','⇥ Sign in / Register']];$('#nav').innerHTML=items.map(([p,t])=>`<button class="nav ${p===page?'active':''}" onclick="go('${p}')">${t}</button>`).join('')};function card(b){return `<article class="book"><div class="cover">${esc(b.title)}</div><h4>${esc(b.title)}</h4><div class="muted">${esc(b.author)} · ${esc(b.category)}</div><p>⭐ 4.8 · $${Number(b.price).toFixed(2)}</p><button onclick="detail(${b.id})">View book</button></article>`}function detail(id){selected=books.find(x=>x.id===id);go('detail')}async function refresh(){user=await api('me');books=await api('books');render()}function render(){nav();$('#who').textContent=user?`${user.name} · ${user.role}`:'Guest';$('#auth').textContent=user?'Sign out':'Sign in';$('#auth').onclick=user?async()=>{await api('logout',{});await refresh();go('home')}:()=>go('login');let v=$('#view');let header=t=>`<h2>${t}</h2>`;if(page==='home')v.innerHTML=`<section class="hero"><span>More Than Just a Library</span><h1>Your AI-Powered Reading Ecosystem</h1><p>Discover, read, learn and grow with a connected digital library experience.</p><button onclick="go('catalog')">Start Reading →</button> <button class="secondary" onclick="go('assistant')">Explore AI Tools</button></section><div class="stats"><div class="panel stat">Books<strong>${books.length}</strong></div><div class="panel stat">Genres<strong>${new Set(books.map(b=>b.category)).size}</strong></div><div class="panel stat">Customer & Merchant<strong>2 roles</strong></div><div class="panel stat">Your Library<strong>Personal</strong></div></div><div class="panel">${header('Popular Books')}<div class="grid">${books.slice(0,6).map(card).join('')}</div></div>`;
else if(page==='catalog')v.innerHTML=`<div class="panel">${header('Book Catalog & Search')}<div class="row"><select id="category" onchange="filter()"><option value="">All categories</option>${[...new Set(books.map(b=>b.category))].map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="secondary" onclick="filter()">Search</button></div></div><div id="results" class="grid">${books.map(card).join('')}</div>`;
else if(page==='detail'&&selected)v.innerHTML=`<div class="panel split"><div><span class="pill">${esc(selected.category)}</span><h2>${esc(selected.title)}</h2><p>by ${esc(selected.author)}</p><p>${esc(selected.description)}</p><h3>$${Number(selected.price).toFixed(2)}</h3><button onclick="buy(${selected.id},${selected.price})">${selected.price?'Create Order':'Add Free Book'}</button> <button class="secondary" onclick="go('catalog')">Back</button></div><div class="cover">${esc(selected.title)}</div></div><div class="panel"><h3>Reader reviews</h3><div id="reviews">Loading...</div>${user?`<textarea id="review" placeholder="Write a review"></textarea><select id="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option></select><button onclick="review()">Post review</button>`:''}</div>`;
else if(page==='login')v.innerHTML=`<div class="panel form">${header('Sign in')}<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Sign in</button><hr>${header('Create account')}<input id="name" placeholder="Full name"><input id="newemail" type="email" placeholder="Email"><input id="newpassword" type="password" placeholder="Password (10+ characters)"><select id="role"><option value="customer">Customer / Reader</option><option value="merchant">Merchant / Publisher</option></select><button onclick="signup()">Register</button></div>`;
else if(page==='merchant')v.innerHTML=user&&['merchant','admin'].includes(user.role)?`<div class="panel">${header('Author & Publisher Portal')}<p>Submit a new listing for moderation.</p><input id="title" placeholder="Book title"><input id="author" placeholder="Author"><input id="genre" placeholder="Genre"><input id="price" type="number" min="0" step="0.01" placeholder="Price"><textarea id="description" placeholder="Description"></textarea><button onclick="listing()">Submit Book</button></div><div class="panel"><h3>Your listings</h3><div id="listings"></div></div>`:`<div class="panel"><h2>Merchant access</h2><p>Register or sign in with a merchant account to submit books.</p><button onclick="go('login')">Sign in</button></div>`;
else if(page==='library')v.innerHTML=`<div class="panel">${header('My Bookshelf')}<div id="mine">Sign in to view your library.</div></div>`;
else if(page==='reader')v.innerHTML=`<div class="panel">${header('Book Reading Interface')}<p>Licensed book text is not included. This demo does not display copyrighted book pages.</p><p>Use the notes workspace to save your own reading notes.</p><button onclick="go('notes')">Open Notes</button></div>`;
else if(page==='notes')v.innerHTML=`<div class="panel">${header('Reading Notes')}<textarea id="note" placeholder="Write a note about your reading..."></textarea><button onclick="saveNote()">Save Note</button><div id="notelist"></div></div>`;
else if(page==='dashboard')v.innerHTML=`<div class="panel">${header('Library Dashboard')}<div class="stats"><div class="stat">Catalog<strong>${books.length}</strong></div><div class="stat">Categories<strong>${new Set(books.map(b=>b.category)).size}</strong></div><div class="stat">Account<strong>${user?esc(user.role):'Guest'}</strong></div></div><p>Live account-wide analytics and charts require additional implementation.</p></div>`;
else if(page==='orders')v.innerHTML=`<div class="panel">${header('Purchase Orders')}<p>Orders remain pending until a verified payment gateway is integrated.</p><div id="orderlist"></div></div>`;
else if(page==='assistant')v.innerHTML=`<div class="panel">${header('AI Book Assistant')}<p>AI API integration is not configured. Browse curated books by genre below.</p><div class="grid">${books.slice(0,4).map(card).join('')}</div></div>`;
else if(page==='community')v.innerHTML=`<div class="panel">${header('Reading Community')}<p>Discussion groups, moderation, book clubs and events are planned modules; they are not yet implemented.</p></div>`;
if(page==='detail'&&selected)loadReviews();if(page==='library'&&user)api('my-books').then(a=>$('#mine').innerHTML=`<div class="grid">${a.map(card).join('')||'Your bookshelf is empty.'}</div>`);if(page==='merchant'&&user&&['merchant','admin'].includes(user.role))api('my-listings').then(a=>$('#listings').innerHTML=a.map(x=>`<p>${esc(x.title)} — ${x.approved?'Approved':'Pending review'}</p>`).join('')||'No listings yet.');if(page==='notes'&&user)api('notes').then(a=>$('#notelist').innerHTML=a.map(n=>`<p class="panel">${esc(n.body)} <span class="muted">${esc(n.created)}</span></p>`).join(''));if(page==='orders'&&user)api('orders').then(a=>$('#orderlist').innerHTML=a.map(o=>`<p>${esc(o.title)} — $${o.amount} — ${esc(o.status)}</p>`).join('')||'No orders yet.')}
function filter(){let q=$('#search').value.toLowerCase(),c=$('#category').value;$('#results').innerHTML=books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)&&(!c||b.category===c)).map(card).join('')||'No matching books'}$('#search').addEventListener('input',()=>{if(page!=='catalog')go('catalog');filter()});async function run(fn){try{await fn()}catch(e){notice(e.message)}}async function login(){run(async()=>{await api('login',{email:$('#email').value,password:$('#password').value});await refresh();go('home')})}async function signup(){run(async()=>{await api('signup',{name:$('#name').value,email:$('#newemail').value,password:$('#newpassword').value,role:$('#role').value});notice('Registration successful. Sign in above.')})}async function listing(){run(async()=>{let r=await api('books',{title:$('#title').value,author:$('#author').value,category:$('#genre').value,price:$('#price').value,description:$('#description').value});notice(r.message);render()})}async function buy(id,price){run(async()=>{let r=await api(price?'checkout':'add-free',{book_id:id});notice(r.message||'Added to your bookshelf')})}async function saveNote(){run(async()=>{await api('notes',{book_id:selected?.id||1,body:$('#note').value});notice('Note saved');render()})}async function review(){run(async()=>{await api('reviews',{book_id:selected.id,rating:$('#rating').value,body:$('#review').value});loadReviews()})}async function loadReviews(){let a=await api('reviews?book_id='+selected.id);$('#reviews').innerHTML=a.map(r=>`<p><b>${esc(r.name)}</b> ⭐${r.rating}: ${esc(r.body)}</p>`).join('')||'No reviews yet.'}refresh().catch(e=>notice(e.message));
</script><link rel="stylesheet" href="/global-tools.css"><script defer src="/global-tools.js"></script></body></html>
