<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LibraAI • Extended Modules</title><style>body{margin:0;font:15px system-ui;background:#edf3ff;color:#14285b}header{background:linear-gradient(110deg,#111d57,#6e63e7);color:white;padding:22px 5%}header a{color:white}main{max-width:1180px;margin:auto;padding:22px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{background:#6057e9;color:white;border:0;padding:10px 15px;border-radius:9px;cursor:pointer}nav button{background:#fff;color:#373c95}.panel{background:white;padding:22px;border-radius:15px;margin:15px 0;box-shadow:0 3px 20px #10205010}input,textarea,select{display:block;max-width:700px;width:100%;padding:11px;border:1px solid #d4dcf2;border-radius:9px;margin:10px 0;box-sizing:border-box}textarea{min-height:110px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.tile{border:1px solid #dce4f5;border-radius:12px;padding:15px}#status{color:#434bc0;font-weight:600}.muted{color:#6c7797}.reader{max-width:750px;margin:auto;line-height:2;white-space:pre-wrap;font-family:Georgia,serif;font-size:19px}h1{margin:0}a{color:#5549dd}</style><header><h1>📚 LibraAI · Extended Ecosystem</h1><p>Reader · Study tools · Clubs · Branches · Publisher management</p><a href="/">← Main website</a></header><main><div id="status">Loading account...</div><nav id="nav"></nav><div id="screen"></div></main><script>
let me=null,books=[],mine=[],active='overview';const $=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,b){const r=await fetch('/api/'+p,{method:b===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}function message(x){$('#status').textContent=x}async function call(p,b,then){try{let r=await api('extra/'+p,b);message('Saved successfully');if(then)await then(r);return r}catch(e){message(e.message)}}const options=(arr)=>arr.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');const fieldBooks=()=>`<select id="bid">${options(books)}</select>`;const ownBooks=()=>`<select id="bid">${options(mine)}</select>`;function section(t,x){return `<section class="panel"><h2>${t}</h2>${x}</section>`}async function show(p){active=p;$('#nav').innerHTML=['overview','reader','study','community','network','subscription','publisher','admin'].map(x=>`<button onclick="show('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('');let out='';if(p==='overview'){let d=me?await api('extra/analytics'):null;out=section('Your library overview',d?`<div class="grid">${Object.entries(d).map(([k,v])=>`<div class="tile"><h3>${esc(k.replaceAll('_',' '))}</h3><h1>${v}</h1></div>`).join('')}</div>`:'<p>Sign in on the main site to see your analytics.</p>')+section('Book catalog',`<div class="grid">${books.map(b=>`<div class="tile"><h3>${esc(b.title)}</h3><p>${esc(b.author)}</p><p>$${b.price}</p></div>`).join('')}</div>`)}
if(p==='reader'){out=section('Digital reader',`<p>Displays publisher-authorized text only for books in your bookshelf. PDF, EPUB, audio and comics require properly licensed uploads and specialized renderers.</p>${ownBooks()}<button onclick="read()">Open Book</button><div id="content" class="reader"></div>`)+section('Reading progress',`${ownBooks().replace('id="bid"','id="progressBook"')}<input id="pct" type="number" min="0" max="100" placeholder="Percent completed"><button onclick="call('progress',{book_id:+$('#progressBook').value,percent:+$('#pct').value})">Save Progress</button><div id="progress"></div>`)}
if(p==='study'){out=section('Study assistant · local extractive mode',`<p>This is a deterministic summary/keyword helper, not an external generative AI model.</p><textarea id="source" placeholder="Paste text you own or are permitted to process"></textarea><button onclick="study()">Summarize and make question</button><div id="studyResult"></div>`)+section('Flashcards',`${fieldBooks()}<input id="question" placeholder="Question"><textarea id="answer" placeholder="Answer"></textarea><button onclick="call('card',{book_id:+$('#bid').value,question:$('#question').value,answer:$('#answer').value},()=>show('study'))">Create card</button><div id="cards"></div>`)}
if(p==='community'){let posts=await api('extra/community'),clubs=await api('extra/clubs');out=section('Reading community',`<textarea id="post" placeholder="Share a reading insight..."></textarea><button onclick="call('post',{body:$('#post').value},()=>show('community'))">Publish</button>${posts.map(x=>`<div class="tile"><b>${esc(x.name)}</b><p>${esc(x.body)}</p><small>${esc(x.created)}</small></div>`).join('')}`)+section('Book clubs',`<div class="grid">${clubs.map(x=>`<div class="tile"><h3>${esc(x.name)}</h3><p>${esc(x.description)}</p><button onclick="call('join',{club_id:${x.id}})">Join club</button></div>`).join('')}</div>`)}
if(p==='network'){let branches=await api('extra/branches'),events=await api('extra/events');out=section('Library network & book request',`${fieldBooks()}<select id="branch">${branches.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select><button onclick="call('request',{book_id:+$('#bid').value,branch:$('#branch').value},()=>show('network'))">Request at branch</button><p class="muted">Request does not confirm inventory or reservation; staff must verify.</p><div id="requests"></div>`)+section('Branches',branches.map(x=>`<p>${esc(x.name)} · ${esc(x.city)}</p>`).join(''))+section('Events',events.map(x=>`<p>${esc(x.title)} · ${esc(x.date)}</p>`).join('')||'No events published yet.')}
if(p==='subscription'){let s=me?await api('extra/subscription'):null;out=section('Membership plans',`<div class="grid"><div class="tile"><h3>Free</h3><p>Local library account</p></div><div class="tile"><h3>Premium</h3><p>Payment integration pending</p></div><div class="tile"><h3>Student</h3><p>Payment integration pending</p></div></div><p>Current plan: ${esc(s?.plan||'not signed in')}</p><button onclick="call('subscription',{plan:'premium'})">Request premium checkout</button><p class="muted">No charge is taken. Plans are not activated without verified payment.</p>`)}
if(p==='publisher'){out=section('Merchant content management',`<p>Upload original or appropriately licensed plain-text reading material for your own approved listing.</p><input id="bookid" type="number" placeholder="Your book ID"><textarea id="contentText" placeholder="Authorized book text"></textarea><label><input id="rights" type="checkbox" style="width:auto;display:inline"> I confirm I own or have rights to distribute this content.</label><p><button onclick="call('content',{book_id:+$('#bookid').value,content:$('#contentText').value,rights_confirmed:$('#rights').checked})">Save licensed content</button></p><p class="muted">Merchant listings are created on the main website's Publisher Portal.</p>`)}
if(p==='admin'){out=section('Admin moderation',`<p>Only existing administrator accounts may approve or reject listings.</p><div id="pending"></div>`)}
$('#screen').innerHTML=out;if(p==='study'&&me)api('extra/cards').then(a=>$('#cards').innerHTML=a.map(x=>`<div class="tile"><b>${esc(x.question)}</b><p>${esc(x.answer)}</p></div>`).join(''));if(p==='network'&&me)api('extra/requests').then(a=>$('#requests').innerHTML=a.map(x=>`<p>${esc(x.title)} — ${esc(x.branch)} — ${esc(x.status)}</p>`).join(''));if(p==='reader'&&me)api('extra/progress').then(a=>$('#progress').innerHTML=a.map(x=>`<p>${esc(x.title)}: ${x.percent}%</p>`).join(''));if(p==='admin'&&me)api('extra/moderation').then(a=>$('#pending').innerHTML=a.map(x=>`<div class="tile"><b>${esc(x.title)}</b> by ${esc(x.author)} <button onclick="moderate(${x.id},true)">Approve</button> <button onclick="moderate(${x.id},false)">Reject</button></div>`).join('')||'No pending books').catch(e=>message(e.message))}
async function read(){let x=await call('reader?book_id='+$('#bid').value);if(x)$('#content').textContent=x.content}async function study(){let x=await call('study',{text:$('#source').value});if(x)$('#studyResult').innerHTML=`<h3>Summary</h3><p>${esc(x.summary)}</p><h3>Keywords</h3><p>${x.keywords.map(esc).join(', ')}</p><h3>Practice</h3><p>${esc(x.question)}</p><p>${esc(x.answer)}</p>`}async function moderate(book_id,approve){await call('moderate',{book_id,approve},()=>show('admin'))}async function init(){try{me=await api('me');books=await api('books');mine=me?await api('my-books'):[];message(me?'Signed in: '+me.name+' ('+me.role+')':'Guest: sign in at the main website to use personalized modules');show('overview')}catch(e){message(e.message)}}init();
</script><link rel="stylesheet" href="/global-tools.css"><script defer src="/global-tools.js"></script></html>
